[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-report"
version = "0.1.0"
description = "Versioned financial filings and reproducible asset-structure analysis"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "pypdf>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
stock-report = "stock_report.cli:main"
stock-report-asset-review = "stock_report.asset_review_agent:main"
