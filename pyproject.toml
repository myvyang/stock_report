[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-report"
version = "0.1.0"
description = "Versioned financial filings and reproducible asset-structure analysis"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "pypdf>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
